<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tuyển sinh ĐH/CĐ{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}?v=20260922p" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark app-nav sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">
        <i class="bi bi-mortarboard-fill me-1"></i> Tuyển sinh ĐH/CĐ
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav nav-pills ms-auto gap-1 align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">Tổng quan</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'schools_page' %}active{% endif %}" href="{{ url_for('schools_page') }}">① Danh sách trường</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'crawl_page' %}active{% endif %}" href="{{ url_for('crawl_page') }}">② Cào dữ liệu</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'quy_doi_page' %}active{% endif %}" href="{{ url_for('quy_doi_page') }}">③ Quy đổi điểm</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'datasets_page' %}active{% endif %}" href="{{ url_for('datasets_page') }}">
              <i class="bi bi-database me-1"></i>Dữ liệu hệ thống
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer py-4 mt-auto">
    <div class="container small text-center text-muted">
      Nguồn công khai: tuyensinh247 · Lưu tại <code>data/output/</code> &amp; <code>data/datasets/</code>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}?v=20260922o"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
