{% extends "base.html" %}
{% block title %}Thông tin cá nhân{% endblock %}
{% block head %}
<style>
  #profileForm .cert-label { cursor: help; border-bottom: 1px dotted var(--ink-soft, #6c757d); }
</style>
{% endblock %}
{% block content %}
<div class="card panel-card">
  <div class="card-body">
    <h1 class="h5 mb-3">Thông tin cá nhân</h1>
    <form id="profileForm" class="row g-2">
      <div class="col-3">
        <label class="form-label small mb-1" for="hoTen">Họ tên</label>
        <input type="text" class="form-control form-control-sm" id="hoTen" maxlength="120" autocomplete="name">
      </div>
      <div class="col-3">
        <label class="form-label small mb-1" for="ngaySinh">Ngày sinh</label>
        <input type="date" class="form-control form-control-sm" id="ngaySinh">
      </div>
      <div class="col-3">
        <label class="form-label small mb-1" for="gioiTinh">Giới tính</label>
        <select class="form-select form-select-sm" id="gioiTinh">
          <option value="">Chọn</option>
          <option value="Nam">Nam</option>
          <option value="Nữ">Nữ</option>
          <option value="Khác">Khác</option>
        </select>
      </div>
      <div class="col-3">
        <label class="form-label small mb-1" for="diaChi">Địa chỉ</label>
        <input type="text" class="form-control form-control-sm" id="diaChi" maxlength="300" autocomplete="street-address">
      </div>
      <div class="col-12 mt-2">
        <div class="form-label small mb-1">Điểm chứng chỉ</div>
        <div class="row g-2" id="certInputs"></div>
      </div>
      <div class="col-12 mt-2">
        <button type="submit" class="btn btn-teal" id="btnSaveProfile">
          <i class="bi bi-save"></i> Lưu thông tin
        </button>
      </div>
    </form>
    <div id="profileMsg" class="mt-3"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const PROFILE_CERTS = [
  ['IELTS', 'VD: 7.6', 'IELTS Academic. Thang điểm 0–9, dùng phổ biến khi xét tuyển và cộng điểm chứng chỉ tiếng Anh.'],
  ['TOEFL iBT', 'VD: 94', 'TOEFL thi trên máy (Internet-based Test). Thang thường 0–120.'],
  ['TOEFL ITP', 'VD: 627', 'TOEFL dạng giấy (Institutional Testing Program). Thang thường 310–677.'],
  ['TOEIC', 'VD: 800', 'TOEIC Listening & Reading. Thang 10–990.'],
  ['TOEIC SW', 'VD: 300', 'TOEIC Speaking & Writing. Thang 0–400.'],
  ['VSTEP', 'VD: 6', 'Khung năng lực ngoại ngữ 6 bậc dùng cho Việt Nam. Thường ghi bậc 3–6 hoặc điểm bài thi.'],
  ['Cambridge', 'VD: 180', 'Cambridge English Scale (KET, PET, FCE, CAE, CPE). Thang khoảng 80–230.'],
  ['Aptis', 'VD: 150', 'Aptis của British Council. Điểm tổng thường 0–200.'],
  ['PTE', 'VD: 65', 'PTE Academic. Thang 10–90.'],
  ['Duolingo', 'VD: 120', 'Duolingo English Test. Thang 10–160.'],
  ['TSA', 'VD: 70', 'Bài thi Đánh giá tư duy của Đại học Bách khoa Hà Nội.'],
  ['HSA', 'VD: 90', 'Bài thi Đánh giá năng lực của Đại học Quốc gia Hà Nội.'],
  ['V-ACT', 'VD: 800', 'Bài thi Đánh giá năng lực của Đại học Quốc gia TP.HCM.'],
  ['SPT', 'VD: 80', 'Bài thi Đánh giá năng lực của Đại học Sư phạm Hà Nội.'],
  ['SAT', 'VD: 1400', 'Scholastic Assessment Test. Thang 400–1600.'],
  ['ACT', 'VD: 30', 'American College Testing. Thang 1–36.'],
  ['IB', 'VD: 38', 'International Baccalaureate. Điểm tổng thường 24–45.'],
  ['A-Level', 'VD: 120', 'Chứng chỉ A-Level (Cambridge hoặc Pearson). Nhập điểm UMS hoặc điểm quy đổi của trường.'],
  ['JLPT', 'VD: 140', 'Năng lực tiếng Nhật. Điểm tổng thường 0–180 (cấp N5–N1).'],
  ['HSK', 'VD: 240', 'Năng lực tiếng Trung giản thể. Điểm hoặc cấp HSK 1–6, tùy cách trường quy đổi.'],
  ['HSKK', 'VD: 80', 'HSKK, phần nói của tiếng Trung.'],
  ['TOPIK', 'VD: 180', 'Năng lực tiếng Hàn. Điểm hoặc cấp TOPIK I/II.'],
  ['DELF', 'VD: 75', 'DELF, chứng chỉ tiếng Pháp trình độ A1–B2. Điểm thường trên 100.'],
  ['DALF', 'VD: 70', 'DALF, chứng chỉ tiếng Pháp trình độ C1–C2.'],
  ['DELE', 'VD: 70', 'DELE, chứng chỉ tiếng Tây Ban Nha.'],
  ['TestDaF', 'VD: 16', 'TestDaF, tiếng Đức học thuật. Bậc TDN 3–5 từng kỹ năng, hoặc tổng điểm nếu trường yêu cầu.'],
  ['Goethe', 'VD: 80', 'Goethe-Zertifikat tiếng Đức. Nhập điểm bài thi theo cách trường quy đổi.'],
  ['TRKI', 'VD: 80', 'TRKI / TORFL, chứng chỉ tiếng Nga.'],
  ['TOCFL', 'VD: 4', 'TOCFL, năng lực tiếng Trung phồn thể (Đài Loan).'],
  ['TCF', 'VD: 400', 'TCF, bài kiểm tra tiếng Pháp.'],
  ['GMAT', 'VD: 650', 'GMAT, bài thi sau đại học về quản trị. Thang cổ điển khoảng 200–800.'],
  ['GRE', 'VD: 320', 'GRE General Test. Điểm Verbal + Quantitative thường 260–340.'],
];

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}

function certId(name) {
  return 'cert-' + name.replace(/[^A-Za-z0-9]+/g, '-');
}

function bindTooltips(root) {
  root.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => {
    const current = bootstrap.Tooltip.getInstance(el);
    if (current) current.dispose();
    bootstrap.Tooltip.getOrCreateInstance(el);
  });
}

function renderCertInputs(certs) {
  const box = document.getElementById('certInputs');
  box.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => {
    bootstrap.Tooltip.getInstance(el)?.dispose();
  });
  box.innerHTML = PROFILE_CERTS.map(([name, placeholder, hint]) => `
    <div class="col-3">
      <label class="form-label small mb-1 cert-label" for="${certId(name)}"
        data-bs-toggle="tooltip" data-bs-placement="top" title="${escapeHtml(hint)}">${escapeHtml(name)}</label>
      <input type="number" step="0.01" min="0" class="form-control form-control-sm" id="${certId(name)}"
        data-cert="${escapeHtml(name)}" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(certs[name] || '')}">
    </div>`).join('');
  bindTooltips(box);
}

function fillProfile(profile) {
  document.getElementById('hoTen').value = profile.ho_ten || '';
  document.getElementById('ngaySinh').value = profile.ngay_sinh || '';
  document.getElementById('gioiTinh').value = profile.gioi_tinh || '';
  document.getElementById('diaChi').value = profile.dia_chi || '';
  renderCertInputs(profile.chung_chi || {});
}

document.getElementById('profileForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const msg = document.getElementById('profileMsg');
  const chung_chi = {};
  document.querySelectorAll('#certInputs [data-cert]').forEach(input => {
    const value = String(input.value || '').trim();
    if (value) chung_chi[input.dataset.cert] = value;
  });
  const btn = document.getElementById('btnSaveProfile');
  btn.disabled = true;
  try {
    const res = await fetch('/api/ca-nhan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ho_ten: document.getElementById('hoTen').value,
        ngay_sinh: document.getElementById('ngaySinh').value,
        gioi_tinh: document.getElementById('gioiTinh').value,
        dia_chi: document.getElementById('diaChi').value,
        chung_chi,
      }),
    });
    const data = await res.json();
    if (!data.ok) {
      msg.innerHTML = `<div class="alert alert-warning py-2 mb-0">${data.error || 'Không lưu được.'}</div>`;
      return;
    }
    fillProfile(data.profile || {});
    msg.innerHTML = '<div class="alert alert-success py-2 mb-0">Đã lưu. Khi tính điểm cộng, các chứng chỉ này được điền sẵn.</div>';
  } catch (_) {
    msg.innerHTML = '<div class="alert alert-warning py-2 mb-0">Không lưu được thông tin.</div>';
  } finally {
    btn.disabled = false;
  }
});

(async function loadProfile() {
  renderCertInputs({});
  try {
    const res = await fetch('/api/ca-nhan');
    const data = await res.json();
    if (data && data.ok && data.profile) fillProfile(data.profile);
  } catch (_) {}
})();
</script>
{% endblock %}
